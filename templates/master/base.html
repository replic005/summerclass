<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fa;
        }

        .navbar{
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

        .card{
            border:none;
            border-radius:15px;
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-8px);
            box-shadow:0 15px 30px rgba(0,0,0,.15);
        }

        .card img{
            height:250px;
            object-fit:cover;
        }

        footer{
            margin-top:60px;
            padding:20px;
            background:#212529;
            color:white;
            text-align:center;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">

<a class="navbar-brand fw-bold" href="/">🛒 Islington Marketplace</a>

<ul class="navbar-nav ms-auto">
<li class="nav-item">
<a class="nav-link" href="/">Home</a>
</li>
</ul>

</div>
</nav>

<div class="container py-5">

<h1 class="display-5 fw-bold mb-5">
Welcome to the Islington Marketplace
</h1>

{% block content %}
{% endblock %}

</div>

<footer>

© 2026 Islington Marketplace

</footer>

</body>
</html>
