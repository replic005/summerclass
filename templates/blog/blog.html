{% extends 'master/base.html' %}
{% block title %}Blog{% endblock %}
{% block content %}
    <h2>Blog Posts</h2>
    {% for blog_post in blogs %}
        <div class="blog-post">
            <h3><a href="{% url 'blog_detail' blog_post.id %}">{{ blog_post.title }}</a></h3>
            <p>{{ blog_post.content|truncatewords:30 }}</p>
        </div>
    {% endfor %}
{% endblock %}
