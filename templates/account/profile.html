{% extends 'account/_layout.html' %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<article class="card">
  <header class="card-header">
    <strong class="d-inline-block mr-3">Edit your profile</strong>
  </header>
  <div class="card-body">
    <div class="text-right">
      {% if profile.profile_picture %}
        <img src="{{ profile.profile_picture.url }}" alt="Profile Picture" class="profile-img" style="width:96px;height:96px;object-fit:cover;border-radius:50%;">
      {% else %}
        <img src="/static/images/Logo_v6RgqOa.PNG" alt="Profile Picture" class="profile-img" style="width:96px;height:96px;object-fit:cover;border-radius:50%;">
      {% endif %}
    </div>
    <div class="row">
      <div class="col-md-12">
        <form action="{% url 'edit_profile' %}" method="POST" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="id_first_name">First name:</label>
              <input type="text" name="first_name" value="{{ request.user.first_name }}" maxlength="150" class="form-control" required id="id_first_name">
            </div>
            <div class="form-group col-md-6">
              <label for="id_last_name">Last name:</label>
              <input type="text" name="last_name" value="{{ request.user.last_name }}" maxlength="150" class="form-control" id="id_last_name">
            </div>
            <div class="form-group col-md-6">
              <label for="id_email">Email:</label>
              <input type="email" name="email" value="{{ request.user.email }}" maxlength="150" class="form-control" required id="id_email">
            </div>
            <div class="form-group col-md-6">
              <label for="id_phone_number">Phone number:</label>
              <input type="text" name="phone_number" value="{{ profile.phone_number }}" maxlength="50" class="form-control" id="id_phone_number">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-4">
              <label for="id_gender">Gender:</label>
              <select name="gender" class="form-control" id="id_gender">
                <option value="" {% if not profile.gender %}selected{% endif %}>---------</option>
                <option value="M" {% if profile.gender == 'M' %}selected{% endif %}>Male</option>
                <option value="F" {% if profile.gender == 'F' %}selected{% endif %}>Female</option>
                <option value="O" {% if profile.gender == 'O' %}selected{% endif %}>Other</option>
              </select>
            </div>
            <div class="form-group col-md-4">
              <label for="id_address">Address:</label>
              <input type="text" name="address" value="{{ profile.address }}" maxlength="255" class="form-control" id="id_address">
            </div>
            <div class="form-group col-md-4">
              <label for="id_city">City:</label>
              <input type="text" name="city" value="{{ profile.city }}" maxlength="100" class="form-control" id="id_city">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-4">
              <label for="id_country">Country:</label>
              <input type="text" name="country" value="{{ profile.country|default:'Nepal' }}" maxlength="100" class="form-control" id="id_country">
            </div>
            <div class="form-group col-md-4">
              <label for="id_profile_picture">Profile picture:</label>
              <input type="file" name="profile_picture" class="form-control" accept="image/*" id="id_profile_picture">
            </div>
            <div class="form-group col-md-4">
              <label for="id_payment_qr">Payment QR:</label>
              <input type="file" name="payment_qr" class="form-control" accept="image/*" id="id_payment_qr">
            </div>
          </div>
          <div class="form-group">
            <label for="id_bio">Bio:</label>
            <textarea name="bio" rows="3" maxlength="1000" class="form-control" id="id_bio">{{ profile.bio }}</textarea>
          </div>
          <input type="submit" value="Save" class="btn btn-primary" />
        </form>
      </div>
    </div>
  </div>
</article>
{% endblock %}
