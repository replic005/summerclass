{% extends 'account/_layout.html' %}
{% block title %}{% if product %}Edit Product{% else %}Add Product{% endif %}{% endblock %}
{% block content %}
<article class="card">
  <header class="card-header d-flex justify-content-between align-items-center">
    <strong class="d-inline-block mr-3">{% if product %}Edit Product{% else %}Post a Product{% endif %}</strong>
  </header>

  <div class="card-body">
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="form-row">
        <div class="form-group col-md-12">
          <label for="id_name">Product name:</label>
          <input type="text" name="name" value="{{ product.name|default:'' }}" maxlength="100" class="form-control" required id="id_name">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="id_category">Category:</label>
          <select name="category" class="form-control" required id="id_category">
            <option value="" {% if not product %}selected{% endif %}>---------</option>
            {% for cat in categories %}
              <option value="{{ cat.id }}" {% if product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group col-md-3">
          <label for="id_price">Price:</label>
          <input type="number" step="0.01" name="price" value="{{ product.price|default:'' }}" class="form-control" required id="id_price">
        </div>
        <div class="form-group col-md-3">
          <label for="id_stock">Stock:</label>
          <input type="number" name="stock" value="{{ product.stock|default:1 }}" class="form-control" required id="id_stock">
        </div>
      </div>

      <div class="form-group">
        <label for="id_description">Description:</label>
        <textarea name="description" rows="6" maxlength="1000" class="form-control" id="id_description">{{ product.description|default:'' }}</textarea>
      </div>

      <div class="form-group">
        <label for="id_product_image">Image:</label>
        <input type="file" name="product_image" class="form-control" accept="image/*" {% if not product %}required{% endif %} id="id_product_image">
        {% if product.product_image %}
          <img src="{{ product.product_image.url }}" style="width:80px;height:80px;object-fit:cover;border-radius:6px;margin-top:8px;">
        {% endif %}
      </div>

      <div class="form-group form-check">
        <input type="checkbox" name="status" class="form-check-input" id="id_status" {% if product.status or not product %}checked{% endif %}>
        <label class="form-check-label" for="id_status">Published (visible in the store)</label>
      </div>

      <button type="submit" class="btn btn-primary">{% if product %}Save Changes{% else %}Submit Product{% endif %}</button>
    </form>
  </div>
</article>
{% endblock %}
